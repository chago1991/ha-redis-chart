---
- name: Resolve cluster topology
  ansible.builtin.set_fact:
    valkey_server_enabled_resolved: "{{ valkey_server_enabled | bool }}"
    valkey_sentinel_enabled_resolved: "{{ valkey_sentinel_enabled | bool }}"
    valkey_haproxy_enabled_resolved: "{{ valkey_haproxy_enabled | bool }}"
    valkey_cluster_nodes_resolved: "{{ valkey_cluster_nodes | list }}"
    valkey_haproxy_backend_nodes_resolved: "{{ valkey_haproxy_backend_nodes | list }}"
    valkey_primary_host_resolved: "{{ valkey_primary_host }}"
    valkey_primary_address_resolved: >-
      {{
        (
          hostvars.get(valkey_primary_host, {}).valkey_advertise_address
          | default(hostvars.get(valkey_primary_host, {}).ansible_host)
          | default(valkey_primary_host)
        )
        if (valkey_primary_host | length > 0)
        else ''
      }}
    valkey_current_address_resolved: "{{ valkey_advertise_address }}"

- name: Validate Valkey topology
  ansible.builtin.assert:
    that:
      - valkey_cluster_nodes_resolved | length > 0
      - valkey_primary_host_resolved | length > 0
      - valkey_primary_host_resolved in valkey_cluster_nodes_resolved
      - valkey_primary_address_resolved | length > 0
      - not valkey_sentinel_enabled_resolved or valkey_server_enabled_resolved
      - valkey_auth_mode in ['none', 'shared_password']
      - valkey_sentinel_password | default('') | length == 0
      - valkey_requirepass | length == 0 or (valkey_requirepass is match('^[^\"\\r\\n]+$'))
      - valkey_sentinel_quorum | int >= 1
      - (valkey_sentinel_quorum | int) <= (valkey_cluster_nodes_resolved | length)
    fail_msg: >-
      Define valid cluster hosts, use the supported auth mode (`none` or `shared_password`),
      and leave Sentinel peer auth disabled before enabling Valkey or Sentinel deployment.
  when: valkey_server_enabled_resolved or valkey_sentinel_enabled_resolved

- name: Validate HAProxy backends
  ansible.builtin.assert:
    that:
      - valkey_haproxy_backend_nodes_resolved | length > 0
      - "'AUTH' not in (valkey_disable_commands | map('upper') | list) or valkey_requirepass | length == 0"
      - "'INFO' not in (valkey_disable_commands | map('upper') | list)"
      - "'PING' not in (valkey_disable_commands | map('upper') | list)"
      - "'QUIT' not in (valkey_disable_commands | map('upper') | list)"
      - valkey_requirepass | length == 0 or valkey_haproxy_allow_insecure_auth_transport | bool
    fail_msg: >-
      Define HAProxy backends, keep AUTH/INFO/PING/QUIT enabled for health checks, and explicitly allow insecure backend auth
      transport before enabling HAProxy with password-protected Valkey nodes.
  when: valkey_haproxy_enabled_resolved

- name: Install Valkey packages
  ansible.builtin.package:
    name: "{{ valkey_server_packages }}"
    state: present
  when: valkey_server_enabled_resolved or valkey_sentinel_enabled_resolved

- name: Install HAProxy packages
  ansible.builtin.package:
    name: "{{ valkey_haproxy_packages }}"
    state: present
  when: valkey_haproxy_enabled_resolved

- name: Create Valkey directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(valkey_user) }}"
    group: "{{ item.group | default(valkey_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ valkey_config_dir }}"
      owner: root
      group: root
      mode: '0755'
    - path: "{{ valkey_data_dir }}"
      mode: '0750'
    - path: "{{ valkey_sentinel_state_dir }}"
      mode: '0750'
  when: valkey_server_enabled_resolved or valkey_sentinel_enabled_resolved

- name: Deploy Valkey server configuration
  ansible.builtin.template:
    src: valkey.conf.j2
    dest: "{{ valkey_config_file }}"
    owner: root
    group: "{{ valkey_group }}"
    mode: '0640'
  register: valkey_server_config_result
  when: valkey_server_enabled_resolved

- name: Check existing Sentinel configuration
  ansible.builtin.stat:
    path: "{{ valkey_sentinel_config_file }}"
  register: valkey_sentinel_config_stat
  when: valkey_sentinel_enabled_resolved

- name: Deploy Sentinel base configuration
  ansible.builtin.template:
    src: sentinel-base.conf.j2
    dest: "{{ valkey_sentinel_base_config_file }}"
    owner: root
    group: root
    mode: '0644'
  register: valkey_sentinel_base_config_result
  when: valkey_sentinel_enabled_resolved

- name: Deploy Sentinel bootstrap configuration
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: "{{ valkey_sentinel_config_file }}"
    owner: "{{ valkey_user }}"
    group: "{{ valkey_group }}"
    mode: '0640'
  register: valkey_sentinel_config_result
  when:
    - valkey_sentinel_enabled_resolved
    - valkey_sentinel_overwrite_config | bool or not valkey_sentinel_config_stat.stat.exists

- name: Deploy Valkey systemd unit
  ansible.builtin.template:
    src: valkey.service.j2
    dest: "/etc/systemd/system/{{ valkey_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  register: valkey_server_unit_result
  when: valkey_server_enabled_resolved

- name: Deploy Sentinel systemd unit
  ansible.builtin.template:
    src: valkey-sentinel.service.j2
    dest: "/etc/systemd/system/{{ valkey_sentinel_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  register: valkey_sentinel_unit_result
  when: valkey_sentinel_enabled_resolved

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0640'
  register: valkey_haproxy_config_result
  when: valkey_haproxy_enabled_resolved

- name: Enable and start Valkey
  ansible.builtin.systemd_service:
    name: "{{ valkey_service_name }}"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if (valkey_server_config_result.changed | default(false) or valkey_server_unit_result.changed | default(false)) else 'started' }}"
  when: valkey_server_enabled_resolved

- name: Wait for Valkey to accept connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if valkey_bind_address == '0.0.0.0' else ('::1' if valkey_bind_address == '::' else valkey_bind_address) }}"
    port: "{{ valkey_port }}"
    timeout: 30
  when: valkey_server_enabled_resolved and valkey_sentinel_enabled_resolved

- name: Enable and start Sentinel
  ansible.builtin.systemd_service:
    name: "{{ valkey_sentinel_service_name }}"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if (valkey_sentinel_base_config_result.changed | default(false) or valkey_sentinel_config_result.changed | default(false) or valkey_sentinel_unit_result.changed | default(false)) else 'started' }}"
  when: valkey_sentinel_enabled_resolved

- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: "{{ valkey_haproxy_service_name }}"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if (valkey_haproxy_config_result.changed | default(false)) else 'started' }}"
  when: valkey_haproxy_enabled_resolved
